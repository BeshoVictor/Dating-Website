<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>When To Meet</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="images/favicon2.JPG" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Butterfly+Kids&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="question">
        <h1 style="font-size: 50px; margin: 10px">I Knew You Fell For Me😉</h1>
        <span>When Would You Like to Date?</span>
      </div>
      <form action="see-you.html">
        <div class="form" style="margin: 0">
          <div class="items">
            <div class="form-item">
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>
            <div class="form-item">
              <label for="time">Time</label>
              <input type="time" id="time" required />
            </div>
          </div>
          <div class="button">
            <button type="submit">Let's Meet</button>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
